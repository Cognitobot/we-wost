<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>We Wost</title>
<style>
:root {
--bg: #27c0b3;
--text: #ffffff;
}

html, body {
height: 100%;
margin: 0;
}

body {
background: var(--bg);
display: grid;
place-items: center;
font-family: Impact, Haettenschweiler, "Arial Black", system-ui, sans-serif;
color: var(--text);
overflow: hidden;
}

.wrap {
text-align: center;
padding: 24px;
max-width: 1200px;
width: 100%;
}

h1 {
margin: 0 0 20px;
font-size: clamp(64px, 12vw, 180px);
letter-spacing: 0.04em;
line-height: 0.9;
text-transform: uppercase;
text-shadow: 0 10px 30px rgba(0,0,0,0.22);
}

img {
width: min(720px, 92vw);
height: auto;
display: block;
margin: 0 auto;
filter: drop-shadow(0 18px 30px rgba(0,0,0,0.22));
user-select: none;
-webkit-user-drag: none;
}
</style>
</head>
<body>
<div class="wrap">
<h1>We Wost</h1>
<img src="icecream.jpg" alt="Melted ice cream cone" />
</div>
</body>
</html>
